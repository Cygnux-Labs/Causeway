.roots{display:flex;flex-direction:column;gap:4px}

h1{font-size:22px;letter-spacing:-.015em;margin:0 0 4px}h2{font-size:15px;margin:0 0 10px}h3{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--muted)}

.grid{display:grid;gap:12px}.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .k{font-size:12px;color:var(--muted)}.tile .v{font-size:22px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.tile .v small{font-size:12px;color:var(--muted);font-weight:500}

.stack>*+*{margin-top:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumbs{color:var(--muted);font-size:13px;margin-bottom:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 18px;overflow-x:auto}
.tabs a{padding:8px 12px;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);border-color:var(--ink)}.tabs a:hover{text-decoration:none;color:var(--ink)}

const agent=a=>`<span class="agent"><span class="dot" style="background:${agentColor(a)}"></span>${esc(a)}</span>`;
const sevPill=s=>`<span class="pill p-${s}">${{high:"High",review:"Review",info:"Info"}[s]}</span>`;
const STATUS={confirmed:["p-cause","Primary cause"],contributing:["p-review","Contributing factor"],"ruled-out":["p-ruled","Ruled out"],inconclusive:["p-untested","Inconclusive"],untested:["p-untested","Not tested"],suppressive:["p-accent","Suppresses it"]};
const statusPill=(s,role)=>`<span class="pill ${STATUS[s][0]}">${s==="confirmed"&&role!=="primary"?"Confirmed cause":STATUS[s][1]}</span>`;
const TYPE={input:"Input",decision:"Model call",action:"Tool call",message:"Message"};

/* effect bar: domain -1..1, zero in the middle; dot = effect, whisker = 95% CI */
function effectBar(t){if(!t)return `<span class="sub">–</span>`;const W=150,H=18,x=v=>W/2+v*(W/2-4);const c=t.verdict==="causal"?"var(--cause)":t.verdict==="suppressive"?"var(--accent)":"var(--ruled)";
 return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="effect ${t.effect}"><line x1="${W/2}" x2="${W/2}" y1="2" y2="${H-2}" style="stroke:var(--line2)"/>
 <line x1="${x(t.ci[0])}" x2="${x(t.ci[1])}" y1="${H/2}" y2="${H/2}" style="stroke:${c};stroke-width:3;stroke-linecap:round;opacity:.45"/><circle cx="${x(t.effect)}" cy="${H/2}" r="4.5" style="fill:${c}"/></svg>`}

/* ------------------------------------------------------------------ router */
function route(){const p=location.hash.replace(/^#\/?/,"").split("/").map(decodeURIComponent);return p}
window.addEventListener("hashchange",()=>{closeDrawer();render().then(()=>window.scrollTo(0,0))});
async function render(){const p=route();$("#nav-runs").classList.toggle("on",p[0]!=="influence");$("#nav-inf").classList.toggle("on",p[0]==="influence");
 const app=$("#app");
 if(!DATA){app.innerHTML=`<div class="empty">No data.</div>`;return}
 try{
 if(p[0]==="influence")return renderInfluence(app);
 if(p[0]==="run"&&p[1]){const d=await detail(p[1]);AG={};(d.agents||[]).forEach(a=>agentColor(a.name));return renderRun(app,d,p[2]||"overview",p[3])}
 if(DATA.runs.length===1&&!p[0]){location.replace("#/run/"+encodeURIComponent(DATA.runs[0].run_id));return}
 renderRuns(app)}catch(e){app.innerHTML=`<div class="card">Could not load: ${esc(e.message)}</div>`}}

/* ------------------------------------------------------------------ runs list */
function renderRuns(app){const R=DATA.runs;const high=R.reduce((s,r)=>s+r.alerts.high,0),acts=R.reduce((s,r)=>s+r.actions,0),causes=R.reduce((s,r)=>s+r.confirmed_causes,0);
 app.innerHTML=`<h1>Runs</h1><p class="sub">Every recorded multi-agent run. Open one to see what happened and why.</p>
 <div class="grid tiles" style="margin:14px 0 18px">${tile("Runs",R.length)}${tile("High alerts",high,high>0)}${tile("Tool calls recorded",acts)}${tile("Confirmed causes",causes)}</div>
 <div class="tw"><table><thead><tr><th>Run</th><th>Started (UTC)</th><th>Agents</th><th class="num">Model calls</th><th class="num">Tool calls</th><th>Alerts</th><th class="num">Tests</th><th>Log</th></tr></thead><tbody>
 ${R.map(r=>`<tr class="click" data-href="#/run/${encodeURIComponent(r.run_id)}"><td><div class="mono">${esc(r.run_id)}${r.finished===false?` <span class="pill p-accent">running</span>`:""}${r.guard?` <span class="pill p-untested">guard: ${esc(r.guard)}</span>`:""}</div><div class="sub" style="font-size:12.5px">${esc(trunc(r.task||"",90))}</div></td>
 <td class="mono sub">${esc(r.started.slice(0,19).replace("T"," "))}</td><td>${r.agents.length}</td><td class="num">${r.decisions}</td><td class="num">${r.actions}</td>
 <td><div class="row">${r.alerts.high?`<span class="pill p-high">${r.alerts.high} high</span>`:""}${r.alerts.review?`<span class="pill p-review">${r.alerts.review} review</span>`:""}${!r.alerts.high&&!r.alerts.review?`<span class="sub">none</span>`:""}</div></td>
 <td class="num">${r.tests}${r.confirmed_causes?` <span class="sub">(${r.confirmed_causes} causal)</span>`:""}</td><td>${r.integrity==="ok"?`<span class="pill p-ok">intact</span>`:`<span class="pill p-high">failed</span>`}</td></tr>`).join("")}
 </tbody></table></div>`;
 app.querySelectorAll("tr[data-href]").forEach(tr=>tr.onclick=()=>location.hash=tr.dataset.href)}
const tile=(k,v,bad,small)=>`<div class="tile${bad?" bad":""}"><div class="k">${k}</div><div class="v">${v}${small?` <small>${small}</small>`:""}</div></div>`;

/* ------------------------------------------------------------------ run shell */
function renderRun(app,d,tab,arg){const s=d.summary;const tabs=[["overview","Overview"],["timeline","Timeline"],["why","Why did it happen?"],["graph","Graph"],["agents","Agents"]];
 const base="#/run/"+encodeURIComponent(d.run_id);
 app.innerHTML=`<div class="crumbs"><a href="#/">Runs</a> / <span class="mono">${esc(d.run_id)}</span></div>
 <h1>${esc(trunc(s.task||d.run_id,140))}</h1>
 <div class="row sub" style="font-size:13px">${s.integrity==="ok"?`<span class="pill p-ok">log intact</span>`:`<span class="pill p-high">log failed integrity</span>`}
 ${s.replayable?`<span class="pill p-accent">replayable</span>`:`<span class="pill p-untested">not replayable</span>`}<span>${s.agents.length} agents · ${s.decisions} model calls · ${s.actions} tool calls · ${s.messages} messages</span></div>
 <nav class="tabs">${tabs.map(([k,l])=>`<a href="${base}/${k}" class="${tab===k?"on":""}">${l}${k==="overview"&&s.alerts.high?`<span class="n">${s.alerts.high}</span>`:""}</a>`).join("")}</nav><div id="tab"></div>`;
 const el=$("#tab");({overview:tOverview,timeline:tTimeline,why:tWhy,graph:tGraph,agents:tAgents}[tab]||tOverview)(el,d,arg)}

/* ------------------------------------------------------------------ overview */
function tOverview(el,d){const s=d.summary,base="#/run/"+encodeURIComponent(d.run_id);
 const acts=d.nodes.filter(n=>n.type==="action");const flagged=new Set(d.alerts.filter(a=>a.severity==="high").map(a=>a.node));
 const tok=s.usage.input_tokens+s.usage.output_tokens;
 el.innerHTML=`<div class="stack">
 <section><h3>What the agents did</h3><div class="chips">${acts.map(a=>`<a class="chip ${flagged.has(a.id)?"flag":a.sensitive?"sens":""}" href="${base}/why/${encodeURIComponent(a.id)}" title="${esc(JSON.stringify(a.args))}">${esc(a.agent)} · ${esc(a.label)}${flagged.has(a.id)?" ⚑":""}</a>`).join("")||`<span class="sub">No tool calls.</span>`}</div></section>
 <section><h3>Needs attention</h3>${d.alerts.length?`<div class="stack" style="--g:8px">${d.alerts.map(a=>`<div class="alert ${a.severity}">${sevPill(a.severity)}<div style="flex:1;min-width:0"><div class="t">${esc(a.title)}</div><div class="d">${esc(a.detail)}</div>${(()=>{const c=a.node&&d.actions[a.node]&&d.actions[a.node].candidates.filter(c=>c.status==="confirmed");return c&&c.length?`<div style="margin-top:4px;font-size:13px"><span class="pill p-cause">Confirmed cause</span> ${c.map(x=>`${esc(x.label)} (${sgn(x.test.effect)})`).join(", ")}</div>`:""})()}</div>${a.node&&a.node.startsWith("ev:")&&d.actions[a.node]?`<a class="btn sm" href="${base}/why/${encodeURIComponent(a.node)}">Investigate →</a>`:""}</div>`).join("")}</div>`:`<div class="card sub">No alerts. No untrusted content reached a sensitive action.</div>`}</section>
 <section><div class="grid tiles">${tile("Untrusted inputs",s.untrusted_inputs,false,"of "+s.inputs)}${tile("Model time",ms(s.model_ms))}${tile("Tool time",ms(s.tool_ms))}${tile("Tokens",tok?tok.toLocaleString():"–",false,d.nodes.some(n=>n.usage&&n.usage.estimated)?"estimated":"")}${tile("Errors",s.errors,s.errors>0)}${tile("Causal tests",s.tests,false,s.confirmed_causes+" confirmed")}</div></section>
 <section><h3>How to read the evidence</h3><div class="explain">
 <div><b>Reached</b>Content was in the context of a decision that led to the action. Recorded, not guessed. Says nothing about whether it mattered.</div>
 <div><b>Confirmed cause</b>Replaying the run without it changed how often the action happens, with a 95% interval that excludes zero.</div>
 <div><b>Ruled out</b>Replays without it changed nothing detectable. The interval shows how large an effect could still hide.</div></div></section></div>`}

/* ------------------------------------------------------------------ timeline */
const TL={agent:"",type:"",flag:false,q:""};
function tTimeline(el,d){const agents=[...new Set(d.timeline.map(r=>r.agent))];
 el.innerHTML=`<div class="filters"><select id="f-agent"><option value="">All agents</option>${agents.map(a=>`<option ${TL.agent===a?"selected":""}>${esc(a)}</option>`).join("")}</select>
 <div class="seg" id="f-type">${[["","All"],["input","Inputs"],["decision","Model calls"],["action","Tool calls"],["message","Messages"]].map(([k,l])=>`<button data-k="${k}" class="${TL.type===k?"on":""}">${l}</button>`).join("")}</div>
 <label class="row" style="font-size:13px"><input type="checkbox" id="f-flag" ${TL.flag?"checked":""}> flagged only</label><input type="text" id="f-q" placeholder="Search" value="${esc(TL.q)}" style="flex:1;max-width:260px"></div><div class="tw" id="tl"></div>`;
 const draw=()=>{const flagged=new Set(d.alerts.map(a=>a.node));const rows=d.timeline.filter(r=>(!TL.agent||r.agent===TL.agent)&&(!TL.type||r.type===TL.type)&&(!TL.flag||flagged.has(r.node)||r.trust==="untrusted"&&r.type==="input")&&(!TL.q||r.text.toLowerCase().includes(TL.q.toLowerCase())));
  $("#tl").innerHTML=`<table><thead><tr><th class="num">Time</th><th>Agent</th><th>Event</th><th>What happened</th><th class="num">Took</th></tr></thead><tbody>${rows.map(r=>{const node=d.nodes.find(n=>n.id===r.node);
  const badges=[r.trust==="untrusted"&&r.type==="input"?`<span class="pill p-untrusted">untrusted</span>`:"",r.sensitive?`<span class="pill p-sens">sensitive</span>`:"",r.status==="error"?`<span class="pill p-high">error</span>`:"",r.mode==="stub"?`<span class="pill p-info">stub</span>`:"",flagged.has(r.node)?`<span class="pill p-high">⚑ alert</span>`:""].join(" ");
  return `<tr class="${node?"click":""}" data-node="${node?esc(r.node):""}"><td class="num mono sub">+${r.t_ms.toFixed(1)} ms</td><td>${r.agent==="run"?`<span class="sub">run</span>`:agent(r.agent)}</td><td class="sub" style="white-space:nowrap">${TYPE[r.type]||esc(r.type.replace(".", " "))}</td><td>${esc(r.text)} ${badges}</td><td class="num sub">${ms(r.duration_ms)}</td></tr>`}).join("")||`<tr><td colspan="5" class="empty">Nothing matches.</td></tr>`}</tbody></table>`;
  $("#tl").querySelectorAll("tr[data-node]").forEach(tr=>{if(tr.dataset.node)tr.onclick=()=>openNode(d,tr.dataset.node)})};
 $("#f-agent").onchange=e=>{TL.agent=e.target.value;draw()};$("#f-flag").onchange=e=>{TL.flag=e.target.checked;draw()};$("#f-q").oninput=e=>{TL.q=e.target.value;draw()};
 $("#f-type").querySelectorAll("button").forEach(b=>b.onclick=()=>{TL.type=b.dataset.k;$("#f-type").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));draw()});draw()}

/* ------------------------------------------------------------------ why */
function tWhy(el,d,sel){const base="#/run/"+encodeURIComponent(d.run_id);const acts=d.nodes.filter(n=>n.type==="action");
 if(!acts.length){el.innerHTML=`<div class="card sub">This run has no tool calls to investigate.</div>`;return}
 const sev={};d.alerts.forEach(a=>{if(a.node&&!(a.node in sev))sev[a.node]=a.severity});
 const ordered=[...acts].sort((a,b)=>({high:0,review:1,info:2}[sev[a.id]]??3)-({high:0,review:1,info:2}[sev[b.id]]??3)||a.seq-b.seq);
 sel=sel&&d.actions[sel]?sel:ordered[0].id;const n=d.nodes.find(x=>x.id===sel),A=d.actions[sel];
 const conf=A.candidates.filter(c=>c.status==="confirmed"),contrib=A.candidates.filter(c=>c.status==="contributing"),ruled=A.candidates.filter(c=>c.status==="ruled-out"),inc=A.candidates.filter(c=>c.status==="inconclusive"),unt=A.candidates.filter(c=>c.status==="untested");
 let verdict;
 if(conf.length){const c=conf[0],t=c.test;verdict=`<b>${c.role==="primary"?"Primary cause":"Confirmed cause"}: ${esc(c.label)}.</b> In replays without it, this action happened ${pct(t.p_without)} of the time instead of ${pct(t.p_with)} (n=${t.n}; 95% interval for the drop: ${Math.round(t.ci[0]*100)} to ${Math.round(t.ci[1]*100)} points).`+(conf.length>1?` ${conf.length-1} more confirmed.`:"")}
 else if(contrib.length){const c=contrib[0],t=c.test;verdict=`<b>Contributing factor: ${esc(c.label)}.</b> It makes this action more likely (${pct(t.p_with)} with it, ${pct(t.p_without)} without), but the action mostly happens without it too. Look for why the agent does this on its own.`}
 else if(inc.length)verdict=`<b>No confirmed cause yet, and the tests can't tell.</b> The action reproduced too rarely in replays to separate a real effect from none${inc[0].test&&inc[0].test.n_needed?` (try n=${inc[0].test.n_needed})`:""}.`;
 else if(ruled.length)verdict=`<b>No confirmed cause yet.</b> ${ruled.length} tested source${ruled.length>1?"s":""} had no effect larger than ${Math.round(((ruled[0].test&&ruled[0].test.min_effect)||.2)*100)} points.`;
 else verdict=`<b>Not tested yet.</b> ${A.candidates.length} inputs and channels reached this action. Start with the untrusted ones.`;
 if(conf.length&&contrib.length)verdict+=` Contributing: ${contrib.map(c=>esc(c.label)).join(", ")}.`;
 if(conf.length||contrib.length||ruled.length||inc.length)verdict+=` ${ruled.length} ruled out, ${inc.length} inconclusive, ${unt.length} not tested.`;
 el.innerHTML=`<div class="split"><div><h3>Tool calls</h3><select class="picker-sel" id="pick-sel">${ordered.map(a=>`<option value="${esc(a.id)}" ${a.id===sel?"selected":""}>${sev[a.id]==="high"?"⚑ ":""}${esc(a.label)} · ${esc(a.agent)} #${a.seq}</option>`).join("")}</select><div class="picker">${ordered.map(a=>`<button class="${a.id===sel?"on":""}" data-id="${esc(a.id)}">${sev[a.id]?`<span class="dot" style="background:var(--${sev[a.id]==="high"?"high":sev[a.id]==="review"?"review":"faint"})"></span>`:`<span class="dot" style="background:var(--line2)"></span>`}<span style="min-width:0"><div style="font-weight:550">${esc(a.label)}</div><div class="meta">${esc(a.agent)} · #${a.seq} ${esc(trunc(Object.values(a.args||{}).join(", "),26))}</div></span></button>`).join("")}</div></div>
 <div class="stack"><div class="card"><div class="row" style="justify-content:space-between"><div><div class="sub" style="font-size:12px">${esc(n.agent)} ran</div><div style="font-size:18px;font-weight:650">${esc(n.label)}</div></div><div class="row">${A.sensitive?`<span class="pill p-sens">sensitive${A.sensitive==="heuristic"?" (by name)":""}</span>`:""}<button class="btn sm" id="open-act">Details</button></div></div>
 <div class="tw" style="margin-top:10px"><table><thead><tr><th>Argument value</th><th>Where the value came from</th></tr></thead><tbody>${A.provenance.length?A.provenance.map(p=>`<tr><td class="mono">${esc(trunc(p.value,60))}</td><td class="prov">${p.status==="untrusted-only"?`<span class="pill p-high">only from untrusted content</span> `:p.status==="trusted"?`<span class="pill p-ok">from a trusted source</span> `:p.status==="hashed"?`<span class="pill p-untested">content hashed: can't trace</span> `:`<span class="pill p-info">written by the model</span> `}${esc(p.sources.map(s=>s.label).join(", "))}</td></tr>`).join(""):`<tr><td colspan="2" class="sub">No traceable argument values.</td></tr>`}</tbody></table></div></div>
 <div class="card verdict">${verdict}</div>
 <section><h3>How it got here</h3>${A.lineage.length?mergedLineage(d,A.lineage):`<div class="sub">No upstream inputs recorded.</div>`}</section>
 <section><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Candidate causes</h3>${SERVER&&d.summary.replayable?`<button class="btn sm primary" id="find-cause" title="Remove all untrusted suspects at once, then narrow down">Find the cause</button>`:""}<label class="row sub" style="font-size:12px">Target <input type="text" class="mono target" id="target" value="${esc(A.target)}"></label></div>
 <div class="tw"><table><thead><tr><th>Remove this…</th><th>Status</th><th>Effect on the action</th><th class="num">With → without</th><th class="num" title="Share of this content's wording reused in the next model output">Text reuse</th><th></th></tr></thead><tbody>
 ${A.candidates.map(c=>`<tr><td><div style="font-weight:550">${esc(c.kind==="message"?c.label:short(c.label))}</div><div class="sub" style="font-size:12px">${c.kind==="message"?"message channel":esc(c.label)} ${c.trust==="untrusted"?`<span class="pill p-untrusted" style="font-size:11px">${c.kind==="message"?"carries untrusted content":"untrusted"}</span>`:""}</div></td>
 <td>${statusPill(c.status,c.role)}</td><td>${effectBar(c.test)}${c.test?`<div class="sub mono" style="font-size:11.5px">${sgn(c.test.effect)} [${sgn(c.test.ci[0])}, ${sgn(c.test.ci[1])}]</div>`:""}</td>
 <td class="num">${c.test?`${pct(c.test.p_with)} → ${pct(c.test.p_without)}<div class="sub" style="font-size:11.5px">n=${c.test.n}</div>`:"–"}</td><td class="num sub">${c.reuse?Math.round(c.reuse*100)+"%":"–"}</td>
 <td class="num">${SERVER?`<button class="btn sm" data-test="${esc(c.intervention)}" ${d.summary.replayable?"":"disabled title='Run has no program to replay'"}>${c.test?"Re-test":"Run test"}</button>`:`<button class="btn sm" data-copy="${esc(c.intervention)}">Copy command</button>`}</td></tr>`).join("")}
 </tbody></table></div><p class="sub" style="font-size:12.5px;margin-top:8px">A test replays the run with the item removed (tool results come from the recording; new tool calls are stubbed, so nothing real is re-sent) and compares how often the target action happens.</p></section></div></div>`;
 el.querySelectorAll(".picker button").forEach(b=>b.onclick=()=>location.hash=base+"/why/"+encodeURIComponent(b.dataset.id));$("#pick-sel").onchange=e=>location.hash=base+"/why/"+encodeURIComponent(e.target.value);
 el.querySelectorAll("[data-node]").forEach(s=>s.onclick=()=>openNode(d,s.dataset.node));$("#open-act").onclick=()=>openNode(d,sel);
 el.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{const cmd=`causeway test ${d.path||"runs/"+d.run_id} --remove '${b.dataset.copy}' --target '${$("#target").value}' --n 20 --n-max 160`;navigator.clipboard?.writeText(cmd).then(()=>toast("Command copied"),()=>prompt("Command",cmd))});
 const fc=$("#find-cause");if(fc)fc.onclick=async()=>{fc.disabled=true;fc.textContent="Replaying…";try{const r=await getJSON("api/runs/"+encodeURIComponent(d.run_id)+"/attribute",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({target:$("#target").value,n:10,n_max:80})});
  toast(r.summary,9000);delete DATA.details[d.run_id];await loadWorkspace();render()}catch(e){toast("Attribution failed: "+e.message);fc.disabled=false;fc.textContent="Find the cause"}};
 el.querySelectorAll("[data-test]").forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent="Replaying…";try{const r=await getJSON("api/runs/"+encodeURIComponent(d.run_id)+"/tests",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({intervention:b.dataset.test,target:$("#target").value,n:20,n_max:160})});
  toast(`${r.verdict}: effect ${sgn(r.effect)}`);delete DATA.details[d.run_id];await loadWorkspace();render()}catch(e){toast("Test failed: "+e.message);b.disabled=false;b.textContent="Run test"}})}

function stepHTML(d,id){const x=d.nodes.find(z=>z.id===id);return `<span class="step" data-node="${esc(id)}" style="${x.trust==="untrusted"&&x.type==="input"?"border-color:var(--high)":""}"><span class="ty">${TYPE[x.type]} · ${esc(x.agent)}</span>${esc(trunc(short(x.label),26))}</span>`}
function mergedLineage(d,chains){const groups=new Map();chains.forEach(ch=>{const k=ch.slice(1).join(">");if(!groups.has(k))groups.set(k,{tail:ch.slice(1),roots:[]});groups.get(k).roots.push(ch[0])});
 return [...groups.values()].slice(0,3).map(g=>`<div class="flow" style="margin-bottom:10px"><span class="roots">${g.roots.map(r=>stepHTML(d,r)).join("")}</span>${g.tail.map(id=>`<span class="arr">→</span>${stepHTML(d,id)}`).join("")}</div>`).join("")+(groups.size>3?`<div class="sub">+${groups.size-3} more paths</div>`:"")}

/* ------------------------------------------------------------------ graph */
const GV={inferred:false,ruled:false,fit:true,focus:null};
function tGraph(el,d,focus){if(focus)GV.focus=focus;
 el.innerHTML=`<div class="filters"><label class="row" style="font-size:13px"><input type="checkbox" id="g-inf" ${GV.inferred?"checked":""}> inferred links</label><label class="row" style="font-size:13px"><input type="checkbox" id="g-rul" ${GV.ruled?"checked":""}> ruled-out tests</label>
 <div class="seg"><button id="g-fit" class="${GV.fit?"on":""}">Fit</button><button id="g-full" class="${GV.fit?"":"on"}">Actual size</button></div><button class="btn sm" id="g-clr">Clear highlight</button><span class="sub" style="font-size:12.5px">Click a node to trace it upstream and downstream.</span></div>
 <div class="legend"><span><span class="dot" style="background:var(--t-input)"></span>input</span><span><span class="dot" style="background:var(--t-decision)"></span>model call</span><span><span class="dot" style="background:var(--t-action)"></span>tool call</span><span><span class="dot" style="background:var(--t-message)"></span>message</span>
 <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" style="stroke:var(--edge);stroke-width:1.5"/></svg>recorded flow</span><span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" style="stroke:var(--cause);stroke-width:3"/></svg>confirmed cause</span><span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" style="stroke:var(--edge);stroke-dasharray:4 3"/></svg>inferred</span><span><span class="dot" style="background:transparent;border:2px solid var(--high)"></span>untrusted</span></div>
 <div class="canvas" id="cv"></div>`;
 const ok=e=>e.evidence==="observed"||(e.evidence==="inferred"&&GV.inferred)||(e.evidence==="tested"&&(e.verdict==="causal"||e.verdict==="suppressive"||GV.ruled));
 const E=d.edges.filter(ok),N=d.nodes,by={};N.forEach(n=>by[n.id]=n);
 const depth={};N.forEach(n=>depth[n.id]=0);[...N].sort((a,b)=>a.seq-b.seq).forEach(n=>{d.edges.filter(e=>e.evidence==="observed"&&e.dst===n.id).forEach(e=>{depth[n.id]=Math.max(depth[n.id],depth[e.src]+1)})});
 const cols={};N.forEach(n=>(cols[depth[n.id]]=cols[depth[n.id]]||[]).push(n));const lane=Object.keys(AG);
 Object.values(cols).forEach(c=>c.sort((a,b)=>lane.indexOf(a.agent)-lane.indexOf(b.agent)||a.seq-b.seq));
 const BW=158,BH=42,CX=210,RY=58,PAD=24,nc=Object.keys(cols).length,maxr=Math.max(...Object.values(cols).map(c=>c.length));
 const W=PAD*2+(nc-1)*CX+BW,H=PAD*2+maxr*RY;
 Object.entries(cols).forEach(([c,arr])=>{const off=(maxr-arr.length)*RY/2;arr.forEach((n,i)=>{n.gx=PAD+c*CX;n.gy=PAD+off+i*RY})});
 const tc={input:"--t-input",decision:"--t-decision",action:"--t-action",message:"--t-message"};
 let svg=`<svg id="gsvg" viewBox="0 0 ${W} ${H}" width="${GV.fit?"100%":W}" ${GV.fit?"":`height="${H}"`} style="${GV.fit?`min-width:${Math.min(W,720)}px`:""}"><defs>${["edge","cause","accent"].map(k=>`<marker id="ar-${k}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--${k})"/></marker>`).join("")}</defs><g>`;
 E.forEach((e,i)=>{const s=by[e.src],t=by[e.dst];if(!s||!t)return;const x1=s.gx+BW,y1=s.gy+BH/2,x2=t.gx,y2=t.gy+BH/2,mx=(x1+x2)/2;
  const cause=e.evidence==="tested"&&e.verdict==="causal",sup=e.evidence==="tested"&&e.verdict==="suppressive",ruled=e.evidence==="tested"&&!cause&&!sup;
  const col=cause?"var(--cause)":sup?"var(--accent)":"var(--edge)";const st=`stroke:${col};fill:none;stroke-width:${cause||sup?2.6:1.3};${e.evidence==="inferred"?"stroke-dasharray:5 4;":""}${ruled?"stroke-dasharray:1 4;":""}`;
  svg+=`<path class="gedge" data-i="${i}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2-2},${y2}" style="${st}" marker-end="url(#ar-${cause?"cause":sup?"accent":"edge"})"><title>${esc(e.kind)} (${e.evidence})${e.effect!=null?` effect ${e.effect} [${e.ci}]`:""}</title></path>`;
  if(e.evidence==="tested"){const lx=x2-36,ly=y2-6;svg+=`<text class="elabel gedge" data-i="${i}" x="${lx}" y="${ly}" style="fill:${col}">${sgn(e.effect)}</text>`}});
 svg+=`</g><g>`;N.forEach(n=>{const unt=n.trust==="untrusted"&&n.type==="input";svg+=`<g class="gnode" data-id="${esc(n.id)}" transform="translate(${n.gx},${n.gy})"><rect width="${BW}" height="${BH}" rx="8" style="fill:var(--panel);stroke:${unt?"var(--high)":"var(--line2)"};stroke-width:${unt?2:1}"/><rect width="4" height="${BH-12}" x="6" y="6" rx="2" style="fill:var(${tc[n.type]})"/>
  <text class="nlabel" x="16" y="17">${esc(trunc(short(n.label),20))}</text><text class="nsub" x="16" y="32">${esc(TYPE[n.type])} · ${esc(n.agent)}</text>${n.sensitive?`<circle cx="${BW-10}" cy="10" r="4" style="fill:var(--review)"><title>sensitive</title></circle>`:""}</g>`});
 svg+=`</g></svg>`;$("#cv").innerHTML=svg;
 const hl=id=>{if(!id){document.querySelectorAll(".gnode,.gedge").forEach(x=>x.classList.remove("dim"));return}const keep=new Set([id]),ke=new Set();
  const walk=(dir)=>{const q=[id];const seen=new Set([id]);while(q.length){const x=q.shift();E.forEach((e,i)=>{if((dir>0?e.src:e.dst)===x){ke.add(i);const y=dir>0?e.dst:e.src;keep.add(y);if(!seen.has(y)){seen.add(y);q.push(y)}}})}};walk(1);walk(-1);
  document.querySelectorAll(".gnode").forEach(g=>g.classList.toggle("dim",!keep.has(g.dataset.id)));document.querySelectorAll(".gedge").forEach(p=>p.classList.toggle("dim",!ke.has(+p.dataset.i)))};
 document.querySelectorAll(".gnode").forEach(g=>g.onclick=()=>{GV.focus=g.dataset.id;hl(GV.focus);openNode(d,g.dataset.id)});hl(GV.focus);
 $("#g-inf").onchange=e=>{GV.inferred=e.target.checked;tGraph(el,d)};$("#g-rul").onchange=e=>{GV.ruled=e.target.checked;tGraph(el,d)};
 $("#g-fit").onclick=()=>{GV.fit=true;tGraph(el,d)};$("#g-full").onclick=()=>{GV.fit=false;tGraph(el,d)};$("#g-clr").onclick=()=>{GV.focus=null;hl(null)}}

/* ------------------------------------------------------------------ agents */
function tAgents(el,d){const M=d.matrix;
 const cell=t=>{if(!t)return `<span class="sub">–</span>`;const a=Math.min(1,Math.abs(t.effect));const c=t.verdict==="causal"?`background:color-mix(in srgb,var(--cause) ${Math.round(15+a*60)}%,transparent);color:${a>.5?"#fff":"var(--ink)"}`:t.verdict==="suppressive"?`background:var(--accent-soft);color:var(--accent)`:`background:var(--soft);color:var(--muted)`;return `<span class="cell" style="${c}" title="${esc(t.verdict)} n=${t.n} CI [${t.ci}]">${sgn(t.effect)}</span>`};
 el.innerHTML=`<div class="stack"><section><h3>Agents</h3><div class="grid tiles">${d.agents.map(a=>`<div class="tile"><div>${agent(a.name)}</div><div class="sub" style="font-size:12px;margin:2px 0 8px">${esc(a.role||"")}${a.parent?` · spawned by ${esc(a.parent)}`:""}</div>
 <div class="kv"><dt>model calls</dt><dd>${a.decisions||0}</dd><dt>tool calls</dt><dd>${a.actions||0}</dd><dt>messages</dt><dd>${a.sent||0} sent · ${a.received||0} received</dd><dt>model time</dt><dd>${ms(a.model_ms)}</dd>${a.tokens?`<dt>tokens</dt><dd>${a.tokens.toLocaleString()}</dd>`:""}</div></div>`).join("")}</div></section>
 <section><h3>Do agents actually listen to each other?</h3><div class="tw"><table><thead><tr><th>Channel</th><th class="num">Messages</th><th class="num">Used by the receiver</th><th>Tested influence</th></tr></thead><tbody>
 ${d.channels.map(c=>`<tr><td>${agent(c.channel.split("->")[0])} <span class="sub">→</span> ${agent(c.channel.split("->")[1])}</td><td class="num">${c.sent}</td><td class="num">${c.used}/${c.sent}</td><td>${c.tests.length?c.tests.map(t=>`<div class="row" style="gap:6px">${cell(t)}<span class="mono sub" style="font-size:12px">${esc(t.target)}</span></div>`).join(""):`<span class="sub">not tested · cut this channel in a replay to measure it</span>`}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No messages between agents.</td></tr>`}
 </tbody></table></div><p class="sub" style="font-size:12.5px">"Used" means a later model call had the message in its context. Tested influence removes the channel in replay and measures the change in a target action.</p></section>
 <section><h3>Influence matrix</h3>${M.rows.length?`<div class="tw"><table><thead><tr><th>Removed</th>${M.cols.map(c=>`<th class="mono" style="font-weight:500">${esc(c)}</th>`).join("")}</tr></thead><tbody>${M.rows.map(r=>`<tr><td class="mono">${esc(r)}</td>${M.cols.map(c=>`<td>${cell(M.cells[r+"||"+c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="sub" style="font-size:12.5px">Each cell: change in how often the target happens when the row is removed (−1 to +1). Red = confirmed, grey = ruled out, – = not tested.</p>`:`<div class="card sub">No tests yet. Run <code>causeway matrix RUN --target 'tool=…'</code> to fill this in.</div>`}</section>
 <section><h3>Critical path</h3><div class="flow">${d.critical_path.map((x,i)=>`${i?`<span class="arr">→</span>`:""}<span class="step" style="cursor:default">${esc(x)}</span>`).join("")}</div></section></div>`}

/* ------------------------------------------------------------------ influence */
function renderInfluence(app){const I=DATA.influence;const S=I.sources,T=I.outcomes;
 app.innerHTML=`<h1>Influence</h1><p class="sub" style="max-width:760px">Across all ${DATA.runs.length} runs: which content gets used by agent decisions (cited), what it reaches, and which of those links replays have confirmed. Think of it as a citation index where some citations are proven to matter.</p>
 <div class="legend"><span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" style="stroke:var(--edge);stroke-width:2"/></svg>reached (thicker = more runs)</span><span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" style="stroke:var(--cause);stroke-width:3"/></svg>confirmed cause</span><span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" style="stroke:var(--ruled);stroke-width:2;stroke-dasharray:1 4"/></svg>tested, ruled out</span></div>
 <div class="canvas" id="ig" style="padding:6px"></div>
 <h3 style="margin-top:20px">Sources</h3><div class="tw"><table><thead><tr><th>Content</th><th>Trust</th><th class="num">Runs</th><th class="num">Cited by</th><th>Strongest tested effect</th><th>Confirmed cause of</th></tr></thead><tbody>
 ${S.map(s=>`<tr><td><div style="font-weight:550">${esc(s.labels.join(", "))}</div><div class="sub" style="font-size:12px">${esc(trunc(s.preview,110))}</div></td><td>${s.trust==="untrusted"?`<span class="pill p-untrusted">untrusted</span>`:`<span class="pill p-ok">trusted</span>`}</td><td class="num">${s.runs}</td><td class="num">${s.cited_by} <span class="sub">decisions</span></td>
 <td>${s.max_effect!=null?`<span class="mono">${sgn(s.max_effect)}</span>`:`<span class="sub">untested</span>`}</td><td>${s.confirmed_tools.map(t=>`<span class="pill p-cause">${esc(t)}</span>`).join(" ")||`<span class="sub">–</span>`}</td></tr>`).join("")}</tbody></table></div>`;
 const W=Math.max(640,$("#ig").clientWidth-14),RY=46,H=Math.max(S.length,T.length)*RY+30,LX=250,RX=W-190;
 const sy={},ty={};S.forEach((s,i)=>sy[s.id]=24+i*RY+(Math.max(S.length,T.length)-S.length)*RY/2);T.forEach((t,i)=>ty[t.id]=24+i*RY+(Math.max(S.length,T.length)-T.length)*RY/2);
 const maxr=Math.max(1,...I.edges.map(e=>e.reach_runs));
 let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:600px">`;
 I.edges.forEach(e=>{if(!(e.source in sy)||!(e.tool in ty))return;const y1=sy[e.source],y2=ty[e.tool],mx=(LX+RX)/2;const col=e.confirmed?"var(--cause)":e.ruled_out?"var(--ruled)":"var(--edge)";const w=e.confirmed?3:1+3*e.reach_runs/maxr;
  g+=`<path d="M${LX},${y1} C${mx},${y1} ${mx},${y2} ${RX},${y2}" style="fill:none;stroke:${col};stroke-width:${w};opacity:${e.confirmed?1:.55};${e.ruled_out?"stroke-dasharray:1 5;":""}"><title>${esc(e.tool)}: reached in ${e.reach_runs} runs${e.max_effect!=null?`, max tested effect ${e.max_effect}`:""}</title></path>`;
  if(e.confirmed)g+=`<text x="${RX-46}" y="${y2-6}" class="elabel" style="fill:var(--cause)">${sgn(e.max_effect)}</text>`});
 S.forEach(s=>{g+=`<g transform="translate(${LX},${sy[s.id]})"><circle r="6" style="fill:${s.trust==="untrusted"?"var(--panel)":"var(--t-input)"};stroke:${s.trust==="untrusted"?"var(--high)":"var(--t-input)"};stroke-width:2"/><text x="-12" y="4" text-anchor="end" class="nlabel">${esc(trunc(s.labels[0],30))}</text></g>`});
 T.forEach(t=>{g+=`<g transform="translate(${RX},${ty[t.id]})"><rect x="0" y="-11" width="12" height="22" rx="3" style="fill:var(--t-action)"/><text x="20" y="4" class="nlabel">${esc(t.id)}</text><text x="20" y="17" class="nsub">${t.runs} runs</text></g>`});
 $("#ig").innerHTML=g+`</svg>`}

/* ------------------------------------------------------------------ drawer */
function closeDrawer(){$("#drawer").classList.remove("open");$("#drawer").setAttribute("aria-hidden","true")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
function openNode(d,id){const n=d.nodes.find(x=>x.id===id);if(!n)return;const by={};d.nodes.forEach(x=>by[x.id]=x);const base="#/run/"+encodeURIComponent(d.run_id);
 const ins=d.edges.filter(e=>e.dst===id&&e.evidence!=="tested"),outs=d.edges.filter(e=>e.src===id&&e.evidence!=="tested");
 const link=x=>`<a href="#" data-n="${esc(x.id)}">${esc(trunc(short(x.label),40))}</a> <span class="sub">${esc(x.agent)}</span>`;
 let body="";
 if(n.type==="decision"){body=`<dl class="kv"><dt>model</dt><dd>${esc(n.model)}</dd><dt>purpose</dt><dd>${esc(n.purpose||"–")}</dd><dt>took</dt><dd>${ms(n.duration_ms)}</dd>${n.usage&&n.usage.input_tokens!=null?`<dt>tokens</dt><dd>${n.usage.input_tokens} in · ${n.usage.output_tokens} out${n.usage.estimated?" (estimated)":""}</dd>`:""}<dt>status</dt><dd>${esc(n.status||"ok")}</dd>${n.context_mode?`<dt>context</dt><dd>${n.context_mode==="exact"?"exact (from the recorded request)":"reconstructed (request was hashed)"}</dd>`:""}</dl>
  <h3 style="margin-top:14px">What it saw (${n.context.length})</h3>${n.context.map(c=>`<div class="row" style="margin:3px 0">${c.node&&by[c.node]?link(by[c.node]):esc(c.source)} ${c.trust==="untrusted"?`<span class="pill p-untrusted">untrusted</span>`:""}</div>`).join("")}
  ${n.ablated&&n.ablated.length?`<p class="sub">Removed by intervention: ${n.ablated.length}</p>`:""}<h3 style="margin-top:14px">What it produced</h3><pre>${esc(n.output)}</pre>`}
 else if(n.type==="action"){const A=d.actions[id];body=`<dl class="kv"><dt>tool</dt><dd>${esc(n.tool)}</dd><dt>took</dt><dd>${ms(n.duration_ms)}</dd><dt>status</dt><dd>${esc(n.status)}</dd><dt>executed</dt><dd>${esc(n.mode)}</dd>${n.sensitive?`<dt>sensitive</dt><dd>yes</dd>`:""}${n.policy&&n.policy.decision?`<dt>Tracekit policy</dt><dd>${esc(n.policy.decision)}${n.policy.rule_ids&&n.policy.rule_ids.length?" ("+esc(n.policy.rule_ids.join(", "))+")":""}</dd>`:""}${n.guard?`<dt>guard</dt><dd>${esc(n.guard.verdict)}${n.guard.alerts&&n.guard.alerts.length?": "+esc(n.guard.alerts.map(a=>a.title).join("; ")):""}</dd>`:""}</dl>
  <h3 style="margin-top:14px">Arguments</h3><pre>${esc(JSON.stringify(n.args,null,2))}</pre><h3>Result</h3><pre>${esc(n.result)}</pre>${A?`<a class="btn" href="${base}/why/${encodeURIComponent(id)}">Why did this happen? →</a>`:""}`}
 else{body=`<dl class="kv"><dt>${n.type==="message"?"channel":"source"}</dt><dd>${esc(n.type==="message"?n.agent+" → "+n.to:n.source||n.label)}</dd><dt>trust</dt><dd>${esc(n.trust)}</dd></dl><h3 style="margin-top:14px">Content</h3><pre>${esc(n.content)}</pre>
  ${n.type==="input"?`<a class="btn" href="${base}/graph/${encodeURIComponent(id)}">Show what it reached →</a>`:""}`}
 $("#drawer").innerHTML=`<button class="btn sm x" id="dx">Close</button><div class="sub" style="font-size:12px">${TYPE[n.type]} · ${esc(n.agent)} · event #${n.seq}</div><h2 style="font-size:17px;margin:2px 0 12px;padding-right:60px">${esc(n.label)}</h2>${body}
 ${ins.length?`<h3 style="margin-top:16px">Came from</h3>${ins.map(e=>`<div style="margin:3px 0">${link(by[e.src])} <span class="sub" style="font-size:12px">${esc(e.kind)}${e.evidence==="inferred"?" · inferred":""}</span></div>`).join("")}`:""}
 ${outs.length?`<h3 style="margin-top:16px">Led to</h3>${outs.map(e=>`<div style="margin:3px 0">${link(by[e.dst])} <span class="sub" style="font-size:12px">${esc(e.kind)}${e.evidence==="inferred"?" · inferred":""}</span></div>`).join("")}`:""}
 <h3 style="margin-top:16px">Record</h3><dl class="kv mono" style="font-size:11.5px"><dt>time</dt><dd>${esc(n.ts)}</dd><dt>hash</dt><dd>${esc(n.hash)}</dd><dt>prev</dt><dd>${esc(n.prev)}</dd>${n.evidence?`<dt>Tracekit</dt><dd>${n.evidence.map(x=>`signed record #${esc(x.seq)} ${esc(x.type||"")} <span class="sub">${esc(String(x.hash).slice(0,16))}…</span>`).join("<br>")}</dd>`:""}</dl>`;
 const dr=$("#drawer");dr.classList.add("open");dr.setAttribute("aria-hidden","false");dr.scrollTop=0;$("#dx").onclick=closeDrawer;
 dr.querySelectorAll("[data-n]").forEach(a=>a.onclick=ev=>{ev.preventDefault();openNode(d,a.dataset.n)})}

(async()=>{try{await loadWorkspace()}catch(e){$("#app").innerHTML=`<div class="card">Could not reach the server: ${esc(e.message)}</div>`;return}render();startLive()})();
</script></body></html>
