[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "causeway"
version = "0.2.0"
description = "Causal logs, counterfactual replay and investigation for multi-agent AI systems"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary. All rights reserved."}
authors = [{name = "Bravish Ghosh"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
causeway = "causeway.cli:main"

[tool.setuptools]
packages = ["causeway", "causeway.adapters"]

[tool.setuptools.package-data]
causeway = ["app.html"]
